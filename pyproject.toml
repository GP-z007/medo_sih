[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "udaan-sih"
version = "0.1.0"
description = "Real airfare collection and operator-assisted statistical infrastructure"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "textual>=3,<9", "typer>=0.15,<1", "psutil>=6,<8",
  "polars>=1.25,<2", "pyarrow>=19,<24", "pyyaml>=6,<7",
  "camoufox>=0.4.11,<0.5", "scrapling>=0.3,<0.5", "croniter>=6,<7", "crawl4ai>=0.9.3,<0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
udaan = "udaan.cli:app"

[tool.setuptools.packages.find]
include = ["udaan*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires isolated PostgreSQL/TimescaleDB", "live: explicitly enabled external website test", "desktop: explicitly enabled real local headed browser test"]

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
